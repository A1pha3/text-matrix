baseURL = 'https://txtmix.com/'
#locale = 'en-us'
locale = "zh-CN"
hasCJKLanguage = true
defaultContentLanguage = "zh-cn"
title = 'Text Matrix'
theme = "LoveIt"


enableGitInfo = true
enableRobotsTXT = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[taxonomies]
  category = "categories"
  tag = "tags"

# 相关推荐只由受控 topics 字段建立候选；标签、分类和日期不能单独制造推荐。
[related]
  includeNewer = true
  threshold = 80
  toLower = true

  [[related.indices]]
    name = "topics"
    weight = 100

[params]
  title = "Text Matrix"
  description = "面向中文开发者的 AI Agent、AI 开发工作流与开源工具知识库。"
  readingSpeedCJK = 400
  images = ["images/og-cover.png"]
  # 资源指纹：css/js 文件名带内容 hash，部署后浏览器/CDN 缓存自动失效
  # （2026-08-04 搜索框黑字问题暴露：无指纹 + CDN max-age=14400，旧 css 会被缓存 4 小时）
  fingerprint = "sha256"

  [params.adsense]
    enabled = true
    client = "ca-pub-3883067925168693"
    autoAds = true

  # Google Analytics 4（gtag.js），由 layouts/partials/gtag/head.html 注入 <head>。
  # 注意：勿再配置 [services.googleAnalytics] 或 [params.analytics]（LoveIt 自有配置），
  # 否则主题插槽 plugin/analytics.html 会在 </body> 前重复注入第二个 Google tag
  [params.gtag]
    enabled = true
    id = "G-9JYVVZSDFF"

  [params.author]
    name = "TextMatrix"

  [params.header.title]
    name = "Text Matrix"

  [params.app]
    title = "Text Matrix"
    svgFavicon = "/favicon.svg"

  # 文章结束区使用单一“分享”按钮，不加载 LoveIt 的第三方平台分享器。
  [params.page.share]
    enable = false

  # Giscus：仅生产环境由项目级 comment partial 注入；这些 ID 是公开标识，不是 secret。
  # 评论仓库：A1pha3/text-matrix-comments；评论分类：Comments（Announcement）。
  [params.page.comment]
    enable = true
    [params.page.comment.giscus]
      enable = true
      repo = "A1pha3/text-matrix-comments"
      repoId = "R_kgDOUE3brg"
      category = "Comments"
      categoryId = "DIC_kwDOUE3brs4DEO3_"
      lang = "zh-CN"
      mapping = "pathname"
      # 显示文章对应 Discussion 的主帖反应（包括 👍），作为文章点赞。
      reactionsEnabled = "1"
      emitMetadata = "0"
      inputPosition = "top"
      # 评论区接近视口或用户主动跳转时再加载；项目脚本提供超时、重试和外部入口。
      lazyLoading = true
      lightTheme = "github-light"
      darkTheme = "github-dark"

  [params.footer]
    copyright = false
    custom = '''
<a href="/about/">关于</a> · <a href="/privacy-policy/">隐私政策</a> · <a href="/contact/">联系</a> · <a href="/index.xml">RSS</a>
'''

  [params.pagefind]
    enable = true
    searchPage = "search/"

  [params.section]
    paginate = 30

  [params.list]
    paginate = 30

  [params.home]
    [params.home.posts]
      paginate = 12

  [params.home.profile]
    typeit = false

[menu]
  [[menu.main]]
    identifier = "tech"
    name = "技术笔记"
    url = "/categories/技术笔记/"
    weight = 1
  [[menu.main]]
    identifier = "news"
    name = "行业快讯"
    url = "/categories/行业快讯/"
    weight = 2
  [[menu.main]]
    identifier = "video"
    name = "视频精读"
    url = "/categories/视频精读/"
    weight = 3
  [[menu.main]]
    identifier = "wealth"
    name = "财富自由"
    url = "/categories/财富自由/"
    weight = 4
  [[menu.main]]
    identifier = "thoughts"
    name = "思考与随笔"
    url = "/categories/思考与随笔/"
    weight = 5
