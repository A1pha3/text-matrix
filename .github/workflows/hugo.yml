# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      # 与本地开发（Homebrew 0.161.1）一致。旧值 0.128.0 与本地/Cloudflare 版本
      # 三处不一致，0.128→0.161 行为差异会制造"本地能构建、CI 不能"的假象
      # （2026-08-17 对抗审查）。
      HUGO_VERSION: 0.161.1
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # 必须全量历史：hugo.toml 开了 enableGitInfo，Hugo 默认 lastmod 链
          # [":git", "lastmod", ...] 以 git 提交时间优先。默认 fetch-depth:1 的
          # 浅克隆下每个文件的 GitInfo 都是同一个部署 commit → 全站 sitemap lastmod
          # 与页面"更新时间"永远等于部署当天（2026-08-17 对抗审查实证）。
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Validate publish dates
        run: npm run validate:future-dates
      - name: Lint frontmatter
        run: npm run validate:frontmatter
      - name: Build with Hugo
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}/
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          # 镜像站专用环境：noindex/robots 屏蔽/canonical 指向主域（见
          # layouts/robots.txt、head/meta.html、head/link.html），且不注入 GA/AdSense
          HUGO_ENVIRONMENT: github-pages
        run: npm run build:github-pages
      - name: Verify release assets
        run: npm run validate:release-assets
      - name: Validate article end experience
        run: npm run validate:article-end
      - name: Check internal links
        run: npm run validate:internal-links
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
